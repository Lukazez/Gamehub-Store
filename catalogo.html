<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo - GameHub Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="main.html">Inicio</a></li>
                <li><a href="catalogo.html" class="activo">Catálogo</a></li>
                <li><a href="carrito.html">Carrito <span id="contador-carrito">(0)</span></a></li>
                <li><a href="checkout.html">Checkout</a></li>
                <li><a href="ordenes.html">Mis Órdenes</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenedor-principal layout-catalogo">
        <!-- Barra lateral de Filtros y Orden -->
        <aside class="panel-filtros">
            <h2>Filtros</h2>
            
            <div class="grupo-filtro">
                <label for="ordenar-por">Ordenar por:</label>
                <select id="ordenar-por">
                    <option value="nombre-asc">Nombre (A-Z)</option>
                    <option value="nombre-desc">Nombre (Z-A)</option>
                    <option value="precio-asc">Precio (Menor a Mayor)</option>
                    <option value="precio-desc">Precio (Mayor a Menor)</option>
                </select>
            </div>

            <div class="grupo-filtro">
                <label for="filtro-categoria">Categoría:</label>
                <select id="filtro-categoria">
                    <option value="todas">Todas</option>
                    <option value="perifericos">Periféricos</option>
                    <option value="componentes">Componentes</option>
                    <option value="monitores">Monitores</option>
                </select>
            </div>

            <div class="grupo-filtro">
                <label for="filtro-marca">Marca:</label>
                <select id="filtro-marca">
                    <option value="todas">Todas</option>
                    <option value="ajazz">Ajazz</option>
                    <option value="atk">ATK</option>
                    <option value="asus">ASUS</option>
                </select>
            </div>

            <div class="grupo-filtro">
                <label>Rango de Precio:</label>
                <input type="number" id="precio-min" placeholder="Mínimo" min="0">
                <input type="number" id="precio-max" placeholder="Máximo" min="0">
                <p id="error-precio" class="mensaje-error oculto">El mínimo no puede ser mayor al máximo.</p>
            </div>

            <button id="btn-aplicar-filtros" class="boton-primario">Aplicar Filtros</button>
        </aside>

        <!-- Grilla de Productos -->
        <section class="seccion-productos">
            <h1>Catálogo de Productos</h1>
            <div id="grilla-catalogo" class="grilla-productos">
                <!-- JS inyectará los productos aquí -->
            </div>
            
            <!-- Botón de carga incremental -->
            <div class="contenedor-cargar-mas">
                <button id="btn-cargar-mas" class="boton-secundario oculto">Cargar más productos</button>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 GameHub Store. Todos los derechos reservados.</p>
    </footer>

    <script src="catalogo.js"></script>
</body>
</html>
