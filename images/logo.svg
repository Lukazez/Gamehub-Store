<svg width="240" height="80" viewBox="0 0 240 80" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0F"/>
      <stop offset="100%" stop-color="#1E1E20"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0091EA"/>
    </linearGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo con degradado sutil -->
  <rect width="240" height="80" rx="14" fill="url(#bgGrad)"/>

  <!-- Borde de acento con brillo -->
  <rect x="2" y="2" width="236" height="76" rx="12" fill="none"
        stroke="url(#borderGrad)" stroke-width="2" filter="url(#softGlow)"/>

  <!-- Detalles de esquina estilo gaming -->
  <path d="M10 20 V10 H20" fill="none" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <path d="M230 20 V10 H220" fill="none" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <path d="M10 60 V70 H20" fill="none" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <path d="M230 60 V70 H220" fill="none" stroke="#00E5FF" stroke-width="2" stroke-linecap="round" opacity="0.85"/>

  <!-- Texto perfectamente centrado (horizontal y vertical) -->
  <text x="120" y="41" text-anchor="middle" dominant-baseline="central"
        font-family="'Segoe UI', system-ui, sans-serif"
        font-weight="700" letter-spacing="0.5">
    <tspan font-size="22" fill="#FFFFFF">Game</tspan><tspan font-size="22" fill="#00E5FF">Hub</tspan><tspan font-size="19" font-weight="500" fill="#EAEAEA" dx="6">Store</tspan>
  </text>
</svg>
